<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="only light">
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico?v=3" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png?v=3">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png?v=3">
<meta name="theme-color" content="#0E4A47">
<title>Lost in space · Wacky Worlds Books</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/gift/gift.css">
<style>
.lost{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding:56px 0 72px}
.lost .pic{width:200px;height:200px;border-radius:50%;padding:8px;background:var(--red);animation:float 4s ease-in-out infinite}
.lost .pic img{width:100%;height:100%;object-fit:cover;border-radius:50%;background:#fff}
.lost .code{margin:8px 0 0;font-family:'Lilita One',sans-serif;font-size:clamp(64px,12vw,110px);line-height:1;color:var(--accent)}
.lost h1{margin:0;font-family:'Lilita One',sans-serif;font-weight:400;font-size:clamp(30px,5vw,44px);line-height:1.1;color:var(--teal)}
.lost p{margin:0;max-width:520px;font-size:18px;color:var(--ink-2)}
.lost .cta-row{justify-content:center;margin-top:10px}
@keyframes float{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-10px) rotate(3deg)}}
@media (prefers-reduced-motion:reduce){.lost .pic{animation:none}}
</style>
</head>
<body>

<header class="site">
  <div class="wrap">
    <a class="logo" href="/" aria-label="Wacky Worlds Books home"><img src="/assets/logo-badge.png" alt="Wacky Worlds" width="140" height="84"></a>
    <a class="home" href="/">Visit the website</a>
  </div>
</header>

<main>
  <section class="wrap lost">
    <div class="pic"><img src="/assets/sumix.jpg" alt="SUM-IX the robot, looking a little confused" width="500" height="427"></div>
    <p class="code">404</p>
    <h1>Oops! This page drifted into space.</h1>
    <p>SUM-IX checked every planet, but the page you're looking for isn't here. Maybe the link has a typo, or the page has moved.</p>
    <div class="cta-row">
      <a class="btn btn-solid" href="/">Back to base</a>
      <a class="btn btn-outline" href="/books/sum-ix/">See Book 01</a>
      <a class="btn btn-outline" href="/mission/">Free mission</a>
    </div>
  </section>
</main>

<footer class="site">
  <div class="wrap">
    <span>© 2026 Wacky Worlds Books · wackyworldsbooks.com</span>
    <span><a href="/contact/">Contact</a> · <a href="/privacy/">Privacy</a></span>
  </div>
</footer>
</body>
</html>
